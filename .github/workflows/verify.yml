name: Validation
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  verify:
    name: Checksum check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          check-latest: true

      - name: Install deps
        run: npm install

      - name: Verify tokens
        run: node ./.github/scripts/verify-tokens.mjs

      - name: Verify chains
        run: node ./.github/scripts/verify-chains.mjs
